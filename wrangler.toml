name = "zalobot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Xem log trên dashboard: Worker -> Observability -> Logs
[observability]
enabled = true

# Cron 1: "* * * * *" mỗi phút hỏi Zalo có tin mới không (giữ nguyên, bot nhận tin nhờ dòng này).
# Cron 2, 3: giờ nhắc và giờ chốt. Giờ cron là UTC, giờ Việt Nam = UTC + 7,
#   nên 10:30 VN = 03:30 UTC, 11:15 VN = 04:15 UTC. Chỉ thứ Hai đến thứ Sáu (1-5).
#   Đổi giờ ở đây thì đổi cả GIO_NHAC / GIO_CHOT bên dưới.
[triggers]
crons = ["* * * * *", "30 3 * * 1-5", "15 4 * * 1-5"]

[[d1_databases]]
binding = "DB"
database_name = "com-trua"
database_id = "a879c067-8a76-43d9-821b-6706db82dcae"

[vars]
TEN_BOT = "Bot Ngự Trù"
# Model Gemini. gemini-flash-latest luôn trỏ về bản Flash hiện hành; bị 404/429 thì bot tự thử model dự phòng.
GEMINI_MODEL = "gemini-flash-latest"
# Tin nhắn chứa một trong các từ này thì bot trả lời (cách nhau dấu phẩy)
TU_GOI = "bot,ngự trù"
# Giờ Việt Nam, phải khớp với crons ở trên. Để GIO_NHAC = "" nếu không muốn nhắc.
GIO_NHAC = "10:30"
GIO_CHOT = "11:15"
MUI_GIO = "Asia/Ho_Chi_Minh"
# Mã nhóm nhận tin nhắc và tin chốt (gõ /id trong nhóm). Để trống: tự dùng mọi nhóm có người nhắn 7 ngày qua.
GROUP_IDS = "zgr-e7c577db6cb485eadca5"
# Mã người được dùng /chot và /nghi (gõ /id). Để trống: ai cũng dùng được.
ADMIN_IDS = "3ff63ff4e5a00cfe55b1"
# Địa chỉ công ty để bot gợi ý quán quanh đó (tên đường, quận, thành phố). Trong nhóm có thể đổi bằng /diachi
DIA_DIEM = ""
# Tùy chọn: quán hay đặt mà Google Maps không có (ví dụ cô bán cơm trong hẻm), mỗi quán một dòng. Để trống cũng được.
QUAN_QUEN = ""

# Bí mật KHÔNG để ở đây. Đặt bằng: npx wrangler secret put ZALO_BOT_TOKEN
#   ZALO_BOT_TOKEN, GEMINI_API_KEY, WEBHOOK_SECRET
# Chạy local: tạo file .dev.vars (xem .dev.vars.example)
